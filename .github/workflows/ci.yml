name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install bounded development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check installed dependencies
        run: python -B -m pip check

      - name: Compile package
        run: python -m compileall -q src\pw_locker_sql

      - name: Lint
        run: python -B -m ruff check src tests

      - name: Type check
        run: python -B -m mypy

      - name: Run isolated test suite
        run: python -B -m pytest -q -p no:cacheprovider -m "not sqlserver_integration"
