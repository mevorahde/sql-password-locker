[build-system]
requires = ["setuptools>=77,<79"]
build-backend = "setuptools.build_meta"

[project]
name = "pw-locker-sql"
version = "0.1.0"
description = "Testable foundation for a client-side encrypted SQL Server password vault"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "cryptography>=49,<50",
    "pyperclip>=1.11,<2",
    "pyodbc>=5.3,<6",
    "python-dotenv>=1.2.2,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "PyYAML>=6.0.2,<7",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
    "tomli>=2.2,<3; python_version < '3.11'",
]

[project.scripts]
pw-locker-sql = "pw_locker_sql.cli:main"
pw-locker-sql-gui = "pw_locker_sql.gui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pw_locker_sql.schema.migrations" = ["*.sql"]
"pw_locker_sql.assets" = ["*.png", "*.ico"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "sqlserver_integration: requires an explicitly configured SQL Server test database",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src/pw_locker_sql"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
